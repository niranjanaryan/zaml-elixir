[tool.cibuildwheel.linux]
# Only build CPython (no PyPy) on x86_64 architecture
build = "cp*x86_64"
before-all = [
    # libyaml headers + library
    "yum install -y libyaml-devel",
    # Install Zig
    "cd /tmp",
    "curl -O https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz",
    "tar xf zig-x86_64-linux-0.16.0.tar.xz",
    "mv zig-x86_64-linux-0.16.0 /usr/local/bin/zig-0.16.0",
]
environment = { PATH="$PATH:/usr/local/bin/zig-0.16.0" }
test-command = 'python -c "import zaml; assert zaml.load(\"a: 1\nb: [x, y]\n\") == {\"a\": 1, \"b\": [\"x\", \"y\"]}"'
